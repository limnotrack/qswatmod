[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swatmf"
version = "0.1.0"
description = "Pure-Python scripted workflow for SWAT-MODFLOW post-processing"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "flopy>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]
quarto = [
    "jupyter>=1.0",
    "nbformat>=5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["swatmf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
